[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.5.0"
description = "Local-first enterprise RAG platform: hybrid retrieval, reranking, grounded generation, evaluation and observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Enterprise RAG Platform" }]
keywords = ["rag", "retrieval", "llm", "qdrant", "ollama", "fastapi", "llmops"]

# Núcleo propositalmente enxuto: o sistema roda ponta a ponta apenas com isto.
# Modelos pesados, Qdrant e parsers binários são extras opcionais.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
vectordb = ["qdrant-client>=1.10"]
parsers = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.3"]
dashboard = ["streamlit>=1.35", "pandas>=2.2"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
full = [
    "enterprise-rag[ml,vectordb,parsers,dashboard,otel]",
]

[project.urls]
Homepage = "https://github.com/your-user/enterprise-rag-platform"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: precisa de serviços externos (Qdrant/Ollama)",
    "slow: baixa modelos ou demora",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "apps", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
mypy_path = "src"
