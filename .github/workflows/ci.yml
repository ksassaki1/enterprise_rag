name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backends deterministicos: o pipeline inteiro roda em CI gratuito,
  # sem GPU, sem download de modelo e sem servico externo.
  RAG_VECTOR_BACKEND: memory
  RAG_EMBEDDING_BACKEND: hashing
  RAG_RERANKER_BACKEND: lexical
  RAG_LLM_BACKEND: echo
  RAG_LOG_LEVEL: WARNING

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src apps scripts tests
      # mypy e consultivo enquanto a tipagem nao esta completa ponta a ponta:
      # ele aponta caminhos frageis sem reprovar o PR por anotacao faltando.
      - name: mypy
        run: mypy src
        continue-on-error: true

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: unit + integration + evaluation
        run: pytest --cov=enterprise_rag --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
